name: Build

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build-unix:
    name: on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Mac
            os: macos-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies for Linux
        if: ${{ matrix.name == 'Linux' }}
        run: |
          sudo apt update
          sudo apt install -y libsdl2-dev

      - name: Install dependencies for Mac
        if: ${{ matrix.name == 'Mac' }}
        run: |
          brew install sdl2 coreutils

      - name: Build
        run: make -j$(nproc) zelda3

  windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download TCC
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force third_party/tcc | Out-Null
          Invoke-WebRequest `
            "https://github.com/FitzRoyX/tinycc/releases/download/tcc_20230519/tcc_20230519.zip" `
            -OutFile tcc.zip
          Expand-Archive tcc.zip third_party/tcc-download -Force

          $exe = Get-ChildItem third_party/tcc-download -Filter tcc.exe -Recurse |
            Select-Object -First 1

          if (-not $exe) {
            throw "tcc.exe não encontrado."
          }

          Copy-Item $exe.FullName third_party/tcc/tcc.exe

      - name: Download SDL2
        shell: pwsh
        run: |
          Invoke-WebRequest `
            "https://github.com/libsdl-org/SDL/releases/download/release-2.28.2/SDL2-devel-2.28.2-VC.zip" `
            -OutFile sdl2.zip
          Expand-Archive sdl2.zip third_party/sdl-download -Force

          $header = Get-ChildItem third_party/sdl-download -Filter SDL.h -Recurse |
            Select-Object -First 1

          if (-not $header) {
            throw "SDL.h não encontrado."
          }

          $sdlRoot = $header.Directory.Parent.FullName
          $expectedRoot = Join-Path $PWD "third_party/SDL2-2.28.2"

          if ($sdlRoot -ne $expectedRoot) {
            New-Item -ItemType Directory -Force $expectedRoot | Out-Null
            Copy-Item "$sdlRoot/*" $expectedRoot -Recurse -Force
          }

      - name: Build Windows executable
        shell: cmd
        run: |
          call run_with_tcc.bat
          if not exist zelda3.exe exit /b 1

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: zelda3-windows-x64
          path: |
            zelda3.exe
            third_party/SDL2-2.28.2/lib/x64/SDL2.dll
            zelda3.ini
          if-no-files-found: warn
