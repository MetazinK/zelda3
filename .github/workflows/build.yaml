name: Build

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build-unix:
    name: on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Mac
            os: macos-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies for Linux
        if: ${{ matrix.name == 'Linux' }}
        run: |
          sudo apt update
          sudo apt install -y libsdl2-dev

      - name: Install dependencies for Mac
        if: ${{ matrix.name == 'Mac' }}
        run: |
          brew install sdl2 coreutils

      - name: Build
        run: make -j$(nproc) zelda3
        
  windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download TCC
        shell: pwsh
        run: |
          Invoke-WebRequest `
            "https://github.com/FitzRoyX/tinycc/releases/download/tcc_20230519/tcc_20230519.zip" `
            -OutFile tcc.zip

          Expand-Archive tcc.zip tcc-download -Force

          $exe = Get-ChildItem tcc-download -Filter tcc.exe -Recurse |
            Select-Object -First 1

          if (-not $exe) {
            throw "tcc.exe não encontrado."
          }

          New-Item -ItemType Directory -Force third_party/tcc | Out-Null
          Copy-Item "$($exe.Directory.FullName)/*" third_party/tcc -Recurse -Force

          if (-not (Test-Path third_party/tcc/tcc.exe)) {
            throw "Não foi possível instalar o TCC no caminho esperado."
          }

      - name: Download SDL2
        shell: pwsh
        run: |
          Invoke-WebRequest `
            "https://github.com/libsdl-org/SDL/releases/download/release-2.28.2/SDL2-devel-2.28.2-VC.zip" `
            -OutFile sdl2.zip

          Expand-Archive sdl2.zip sdl-download -Force

          $header = Get-ChildItem sdl-download -Filter SDL.h -Recurse |
            Select-Object -First 1

          if (-not $header) {
            throw "SDL.h não encontrado."
          }

          $sdlRoot = $header.Directory.Parent.FullName
          New-Item -ItemType Directory -Force third_party/SDL2-2.28.2 | Out-Null
          Copy-Item "$sdlRoot/*" third_party/SDL2-2.28.2 -Recurse -Force

          if (-not (Test-Path third_party/SDL2-2.28.2/lib/x64/SDL2.dll)) {
            throw "SDL2.dll não encontrado no caminho esperado."
          }

      - name: Build Windows executable
        shell: cmd
        run: |
          third_party\tcc\tcc.exe -ozelda3.exe -DCOMPILER_TCC=1 -DSTBI_NO_SIMD=1 -DHAVE_STDINT_H=1 -D_HAVE_STDINT_H=1 -DSYSTEM_VOLUME_MIXER_AVAILABLE=0 -Ithird_party/SDL2-2.28.2/include -Lthird_party/SDL2-2.28.2/lib/x64 -lSDL2 -I. src/*.c snes/*.c third_party/gl_core/gl_core_3_1.c third_party/opus-1.3.1-stripped/opus_decoder_amalgam.c
          if errorlevel 1 exit /b 1
          copy third_party\SDL2-2.28.2\lib\x64\SDL2.dll .
          if errorlevel 1 exit /b 1

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: zelda3-windows-x64
          path: |
            zelda3.exe
            SDL2.dll
          if-no-files-found: error
