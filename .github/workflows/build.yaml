  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download TCC
        shell: pwsh
        run: |
          Invoke-WebRequest `
            "https://github.com/FitzRoyX/tinycc/releases/download/tcc_20230519/tcc_20230519.zip" `
            -OutFile tcc.zip
          Expand-Archive tcc.zip third_party/tcc-download

          $exe = Get-ChildItem third_party/tcc-download -Filter tcc.exe -Recurse |
            Select-Object -First 1

          if (-not $exe) {
            throw "tcc.exe não encontrado no arquivo baixado."
          }

          $tccRoot = $exe.Directory.FullName
          "TCC_EXE=$($exe.FullName)" >> $env:GITHUB_ENV

      - name: Download SDL2
        shell: pwsh
        run: |
          Invoke-WebRequest `
            "https://github.com/libsdl-org/SDL/releases/download/release-2.28.2/SDL2-devel-2.28.2-VC.zip" `
            -OutFile sdl2.zip
          Expand-Archive sdl2.zip third_party/sdl-download

          $header = Get-ChildItem third_party/sdl-download -Filter SDL.h -Recurse |
            Select-Object -First 1

          if (-not $header) {
            throw "SDL.h não encontrado no arquivo SDL2."
          }

          $sdlRoot = $header.Directory.Parent.FullName
          "SDL_ROOT=$sdlRoot" >> $env:GITHUB_ENV

      - name: Build Windows executable
        shell: pwsh
        run: |
          & "$env:TCC_EXE" `
            -ozelda3.exe `
            -DCOMPILER_TCC=1 `
            -DSTBI_NO_SIMD=1 `
            -DHAVE_STDINT_H=1 `
            -D_HAVE_STDINT_H=1 `
            -DSYSTEM_VOLUME_MIXER_AVAILABLE=0 `
            "-I$env:SDL_ROOT/include" `
            "-L$env:SDL_ROOT/lib/x64" `
            -lSDL2 `
            -I. `
            src/*.c `
            snes/*.c `
            third_party/gl_core/gl_core_3_1.c `
            third_party/opus-1.3.1-stripped/opus_decoder_amalgam.c

          if ($LASTEXITCODE -ne 0) {
            throw "A compilação do zelda3.exe falhou."
          }

          Copy-Item "$env:SDL_ROOT/lib/x64/SDL2.dll" .

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: zelda3-windows-x64
          path: |
            zelda3.exe
            SDL2.dll
            zelda3.ini
